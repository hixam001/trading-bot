# ============================================================================
# trading-bot — local parity / VM deployment (same image as prod).
#   docker compose up -d --build
# The engine state (kill switch, breakers, idempotency ledger, commit log),
# the SQLite book, and rotating logs live on NAMED VOLUMES: a container restart
# must NEVER reset real-money safety state or wipe audit logs. For managed
# Postgres instead of SQLite set USE_SUPABASE_DB=1 + SUPABASE_DB_URL in .env.
# ============================================================================
services:
  # §51 — FREE web-search transport hop 2 (keyless, unlimited). Self-hosted
  # SearXNG answering format=json for the engine's staged web-evidence
  # search. NOT exposed to the host network: the engine reaches it at
  # http://searxng:8080 inside the compose network (set SEARXNG_URL in
  # .env accordingly). Public instances disable format=json — only our own
  # instance works, which is why this sidecar exists.
  searxng:
    # Pin to a stable tagged release (§77 D3, §78 D1)
    # Pinned to real Docker Hub release: 2026.10.9-f4822b3fc (operator may pin sha256 digest after docker pull)
    image: searxng/searxng:2026.10.9-f4822b3fc
    container_name: trading-bot-searxng
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET must be set in .env to a non-default secret (run openssl rand -hex 32)}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    # Resource note: fits trivially in the Oracle Always Free shape
    # (2 OCPU / 12 GB) alongside the engine (~150-300 MB typical).

  # API service: web server and dashboard ONLY. Mounts state volume read-only (:ro).
  # NEVER receives wallet secret key material (WALLET_KEYPAIR_* are stripped).
  api:
    build: .
    image: trading-bot:latest
    container_name: trading-bot-api
    restart: unless-stopped
    depends_on:
      - searxng
    ports:
      # Default: bind only to loopback so direct connections are restricted to local reverse proxy (Caddy/Nginx) or SSH tunnels.
      # To deliberately expose publicly on all interfaces (not recommended), set: "${API_PORT:-8000}:8000"
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Real-money state — READ-ONLY for the web API process (§77 B2)
      - engine_state:/app/backend/live_execution/state:ro
      # SQLite book (only used when USE_SUPABASE_DB is not 1).
      - engine_data:/app/data
      # Rotating application, error, and security audit logs (§74).
      - engine_logs:/app/logs
    environment:
      - ROLE=api
      - PORT=8000
      - DB_PATH=/app/data/trading_bot.db
      - LOG_DIR=/app/logs
      # Strip wallet key material so the internet-facing API process NEVER holds the signing key:
      - WALLET_KEYPAIR_PATH=
      - WALLET_KEYPAIR_JSON=
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').getcode() == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Live execution service: runs the autonomous decision cycle (run_live_cycle.py).
  # Mounts state volume read-write (rw). Holds the signing key. Not exposed to the internet.
  live:
    build: .
    image: trading-bot:latest
    container_name: trading-bot-live
    restart: on-failure
    depends_on:
      - searxng
    env_file:
      - .env
    volumes:
      # Real-money state — READ-WRITE for the execution runner
      - engine_state:/app/backend/live_execution/state
      # SQLite book (only used when USE_SUPABASE_DB is not 1).
      - engine_data:/app/data
      # Rotating application, error, and security audit logs (§74).
      - engine_logs:/app/logs
      # State backups volume (§79 Phase E).
      - engine_backups:/app/backups
      # Alternative secret channel (preferred on a VM): bind-mount a chmod-600
      # keypair file read-only and point WALLET_KEYPAIR_PATH at it:
      #   - ./secrets/wallet_keypair.json:/run/secrets/wallet_keypair:ro
      #   WALLET_KEYPAIR_PATH=/run/secrets/wallet_keypair
    environment:
      - ROLE=live
      - DB_PATH=/app/data/trading_bot.db
      - LOG_DIR=/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import time, os, sys; p = '/app/backend/live_execution/state/heartbeat.txt'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 300 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  engine_state:
  engine_data:
  engine_logs:
  engine_backups: