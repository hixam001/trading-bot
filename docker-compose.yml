# ============================================================================
# trading-bot — local parity / VM deployment (same image as prod).
#   docker compose up -d --build
# The engine state (kill switch, breakers, idempotency ledger, commit log),
# the SQLite book, and rotating logs live on NAMED VOLUMES: a container restart
# must NEVER reset real-money safety state or wipe audit logs. For managed
# Postgres instead of SQLite set USE_SUPABASE_DB=1 + SUPABASE_DB_URL in .env.
# ============================================================================
# §87 A4: bound Docker's default json-file log growth (no rotation by default;
# the Oracle boot volume is only ~47 GB). Applied to every service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # §51 — FREE web-search transport hop 2 (keyless, unlimited). Self-hosted
  # SearXNG answering format=json for the engine's staged web-evidence
  # search. NOT exposed to the host network: the engine reaches it at
  # http://searxng:8080 inside the compose network (set SEARXNG_URL in
  # .env accordingly). Public instances disable format=json — only our own
  # instance works, which is why this sidecar exists.
  searxng:
    # Pin to a stable tagged release and a registry digest (§77 D3, §78 D1,
    # §92 S8): a moved tag can silently change the search sidecar image.
    image: searxng/searxng:2026.10.9-f4822b3fc@sha256:85492ba800a861e3e8ff6014c430e81369fe6ca766a9990595f616d1ce95b272
    container_name: trading-bot-searxng
    restart: unless-stopped
    logging: *logging
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET must be set in .env to a non-default secret (run openssl rand -hex 32)}
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    # Resource note: fits trivially in the Oracle Always Free shape
    # (2 OCPU / 12 GB) alongside the engine (~150-300 MB typical).

  # API service: web server and dashboard ONLY. Mounts state volume read-only (:ro).
  # NEVER receives wallet secret key material (WALLET_KEYPAIR_* are stripped).
  api:
    build:
      context: .
      # §90-D1: let an operator/CI retry the image without the ARM Chromium
      # install (the engine never launches a browser; only browser scripts do).
      args:
        SKIP_BROWSER: "${SKIP_BROWSER:-0}"
    image: trading-bot:latest
    container_name: trading-bot-api
    restart: unless-stopped
    # §87 B parity: reap children and give uvicorn a clean SIGTERM window.
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 30s
    logging: *logging
    # §92 S8: the API serves static files and reads state; it never needs a
    # writable root filesystem or Linux capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.5
    depends_on:
      - searxng
    ports:
      # Default: bind only to loopback so direct connections are restricted to local reverse proxy (Caddy/Nginx) or SSH tunnels.
      # To deliberately expose publicly on all interfaces (not recommended), set: "${API_PORT:-8000}:8000"
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Real-money state — READ-ONLY for the web API process (§77 B2)
      - engine_state:/app/backend/live_execution/state:ro
      # SQLite book (only used when USE_SUPABASE_DB is not 1).
      - engine_data:/app/data
      # Rotating application, error, and security audit logs (§74).
      - engine_logs:/app/logs
    environment:
      - ROLE=api
      - PORT=8000
      - DB_PATH=/app/data/trading_bot.db
      - LOG_DIR=/app/logs
      # §93 R1: every API runtime write has a home on the writable data
      # volume. The root filesystem stays read-only; no new capabilities.
      - SESSION_REVOCATION_FILE=/app/data/session_revocations.json
      - KB_INGESTED_DIR=/app/data/knowledge_base/ingested
      - SPEND_GUARD_FILE=/app/data/spend_guard_api.json
      - SUPABASE_PIN_FILE=/app/data/.supabase_fp.txt
      # Strip wallet key material so the internet-facing API process NEVER holds the signing key:
      - WALLET_KEYPAIR_PATH=
      - WALLET_KEYPAIR_JSON=
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').getcode() == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Live execution service: runs the autonomous decision cycle (run_live_cycle.py).
  # Mounts state volume read-write (rw). Holds the signing key. Not exposed to the internet.
  live:
    build:
      context: .
      # §90-D1: keep the escape hatch identical to the api service — compose
      # builds the same image twice unless it is told otherwise.
      args:
        SKIP_BROWSER: "${SKIP_BROWSER:-0}"
    image: trading-bot:latest
    container_name: trading-bot-live
    # §87 A3: `on-failure` is NOT restarted after a Docker daemon restart
    # (host reboot), so a maintenance reboot silently left the engine down.
    # §87 B: tini (init) forwards SIGTERM to Python and the grace period lets
    # an in-flight order/ledger write finish instead of being SIGKILLed.
    restart: unless-stopped
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 150s
    logging: *logging
    # §92 S8: state/data/logs/backups are mounted volumes; the root filesystem
    # stays read-only and the signer needs no added capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      - searxng
    env_file:
      - .env
    volumes:
      # Real-money state — READ-WRITE for the execution runner
      - engine_state:/app/backend/live_execution/state
      # SQLite book (only used when USE_SUPABASE_DB is not 1).
      - engine_data:/app/data
      # Rotating application, error, and security audit logs (§74).
      - engine_logs:/app/logs
      # State backups volume (§79 Phase E).
      - engine_backups:/app/backups
      # §87 A2: wallet keypair, one documented path. The host file must be
      # owned by the container uid (10001) and mode 0600/0400 — a bind mount
      # preserves host uid/mode, and wallet.py refuses group/world bits.
      - ${WALLET_KEYPAIR_HOST_PATH:-./secrets/wallet_keypair.json}:/run/secrets/wallet_keypair:ro
    environment:
      - ROLE=live
      - DB_PATH=/app/data/trading_bot.db
      - LOG_DIR=/app/logs
      # §93 R1: runtime writes live on the read-write engine_state volume
      # (blocklist loss memory, Privy sidecar, secret-store key, Supabase pin).
      - LIVE_STATE_DIR=/app/backend/live_execution/state
      - BLOCKLIST_STATE_FILE=/app/backend/live_execution/state/blocklist_state.json
      - FOMO_PRIVY_STATE_FILE=/app/backend/live_execution/state/.fomo_privy.json
      - SECRET_STORE_KEY_FILE=/app/backend/live_execution/state/.secret_store.key
      - SUPABASE_PIN_FILE=/app/backend/live_execution/state/.supabase_fp.txt
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import time, os, sys; p = '/app/backend/live_execution/state/heartbeat.txt'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 300 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  engine_state:
  engine_data:
  engine_logs:
  engine_backups: