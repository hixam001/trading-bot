name: Tests & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'  # Weekly run at 04:00 on Monday (§78 D4)
  workflow_dispatch:

jobs:
  test:
    name: Backend & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install --no-deps -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          pip install pytest pytest-asyncio pip-audit pyflakes

      - name: Run Hermetic Pytest (without .env)
        run: |
          rm -f .env backend/.env
          pytest -q

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Audit frontend dependencies
        run: |
          cd frontend
          npm audit --omit=dev

      - name: Audit Python dependencies
        run: |
          pip-audit -r backend/requirements.lock
