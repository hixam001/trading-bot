name: Tests & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'  # Weekly run at 04:00 on Monday (§78 D4)
  workflow_dispatch:

jobs:
  test:
    name: Backend & Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install --no-deps -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          pip install pytest pytest-asyncio pip-audit pyflakes

      - name: Check Python dependencies for conflicts
        run: |
          pip check

      - name: Run Hermetic Pytest (without .env)
        run: |
          rm -f .env backend/.env
          pytest -q

      - name: Audit Python dependencies
        run: |
          pip-audit -r backend/requirements.lock

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check frontend
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Audit frontend dependencies
        run: |
          cd frontend
          npm audit --omit=dev

      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Start Mock Backend for E2E
        run: |
          DATA_BACKEND=mock RATE_LIMIT_PAID_PER_MINUTE=1000 RATE_LIMIT_GENERAL_PER_MINUTE=2000 uvicorn api.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/api/health | grep -q "ok"; then
              echo "Backend is ready on port 8000."
              break
            fi
            echo "Waiting for backend..."
            sleep 1
          done

      - name: Run Frontend E2E Tests
        run: |
          cd frontend
          npm run test:e2e

  # §87 F3: the image must actually build for the Oracle VM's linux/arm64
  # before the operator's first `up`. This job validates compose interpolation
  # with a dummy .env, then cross-builds the Dockerfile under QEMU. The
  # Chromium/patchright layer is skipped via SKIP_BROWSER=1 to stay inside the
  # job cap; it is a fallback transport, not on the order path, and the VM's
  # native ARM build still installs it. No `--no-cache`: layer caching is
  # wanted. Time cap is the job timeout below.
  docker-arm64:
    name: Docker ARM64 Build + Compose Config
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare dummy .env for compose validation
        run: |
          cp .env.example .env
          sed -i 's/^SEARXNG_SECRET=$/SEARXNG_SECRET=ci-only-dummy-not-a-real-secret/' .env

      - name: Validate docker compose config
        run: docker compose config >/dev/null

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build linux/arm64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg SKIP_BROWSER=1 \
            -t trading-bot:ci-arm64 \
            .
