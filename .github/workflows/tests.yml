name: Tests & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'  # Weekly run at 04:00 on Monday (§78 D4)
  workflow_dispatch:

jobs:
  test:
    name: Backend & Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install --no-deps -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          pip install pytest pytest-asyncio pip-audit pyflakes

      - name: Check Python dependencies for conflicts
        run: |
          pip check

      - name: Run Hermetic Pytest (without .env)
        run: |
          rm -f .env backend/.env
          pytest -q

      - name: Audit Python dependencies
        run: |
          pip-audit -r backend/requirements.lock

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check frontend
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Scan built frontend for secrets
        run: |
          python scripts/scan_frontend_bundle.py --dist frontend/dist

      - name: Audit frontend dependencies
        run: |
          cd frontend
          npm audit --omit=dev

      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Start Mock Backend for E2E
        run: |
          DATA_BACKEND=mock RATE_LIMIT_PAID_PER_MINUTE=1000 RATE_LIMIT_GENERAL_PER_MINUTE=2000 uvicorn api.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/api/health | grep -q "ok"; then
              echo "Backend is ready on port 8000."
              break
            fi
            echo "Waiting for backend..."
            sleep 1
          done

      - name: Run Frontend E2E Tests
        run: |
          cd frontend
          npm run test:e2e

  # §87 F3: the image must actually build for the Oracle VM's linux/arm64
  # before the operator's first `up`. This job validates compose interpolation
  # with a dummy .env, then cross-builds the Dockerfile under QEMU. The
  # Chromium/patchright layer is skipped via SKIP_BROWSER=1 to stay inside the
  # job cap; it is a fallback transport, not on the order path, and the VM's
  # native ARM build still installs it. No `--no-cache`: layer caching is
  # wanted. Time cap is the job timeout below.
  docker-arm64:
    name: Docker ARM64 Build + Compose Config
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare dummy .env for compose validation
        run: |
          cp .env.example .env
          sed -i 's/^SEARXNG_SECRET=$/SEARXNG_SECRET=ci-only-dummy-not-a-real-secret/' .env

      - name: Validate docker compose config
        run: docker compose config >/dev/null

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build linux/arm64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg SKIP_BROWSER=1 \
            -t trading-bot:ci-arm64 \
            .

      # §93 R1: prove the read-only-root contract in a REAL container. Build
      # the native image, then run the runtime-write smoke with --read-only
      # and --tmpfs /tmp against the same volumes/env shape as compose.
      - name: Build native image for ROFS smoke
        run: docker build --build-arg SKIP_BROWSER=1 -t trading-bot:rofs .

      - name: Run live read-only-root write smoke
        run: |
          mkdir -p /tmp/rofs-live/state /tmp/rofs-live/data /tmp/rofs-live/logs /tmp/rofs-live/backups
          chmod 777 /tmp/rofs-live/state /tmp/rofs-live/data /tmp/rofs-live/logs /tmp/rofs-live/backups
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e ROLE=live \
            -e LIVE_STATE_DIR=/app/backend/live_execution/state \
            -e BLOCKLIST_STATE_FILE=/app/backend/live_execution/state/blocklist_state.json \
            -e FOMO_PRIVY_STATE_FILE=/app/backend/live_execution/state/.fomo_privy.json \
            -e SECRET_STORE_KEY_FILE=/app/backend/live_execution/state/.secret_store.key \
            -e SUPABASE_PIN_FILE=/app/backend/live_execution/state/.supabase_fp.txt \
            -e DB_PATH=/app/data/trading_bot.db \
            -e LOG_DIR=/app/logs \
            -v /tmp/rofs-live/state:/app/backend/live_execution/state \
            -v /tmp/rofs-live/data:/app/data \
            -v /tmp/rofs-live/logs:/app/logs \
            -v /tmp/rofs-live/backups:/app/backups \
            trading-bot:rofs python /app/scripts/rofs_smoke.py

      - name: Run api read-only-root write smoke
        run: |
          mkdir -p /tmp/rofs-api/state /tmp/rofs-api/data /tmp/rofs-api/logs
          chmod 777 /tmp/rofs-api/state /tmp/rofs-api/data /tmp/rofs-api/logs
          docker run --rm --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e ROLE=api \
            -e SESSION_REVOCATION_FILE=/app/data/session_revocations.json \
            -e KB_INGESTED_DIR=/app/data/knowledge_base/ingested \
            -e SPEND_GUARD_FILE=/app/data/spend_guard_api.json \
            -e SUPABASE_PIN_FILE=/app/data/.supabase_fp.txt \
            -e DB_PATH=/app/data/trading_bot.db \
            -e LOG_DIR=/app/logs \
            -v /tmp/rofs-api/state:/app/backend/live_execution/state:ro \
            -v /tmp/rofs-api/data:/app/data \
            -v /tmp/rofs-api/logs:/app/logs \
            trading-bot:rofs python /app/scripts/rofs_smoke.py
