name: Tests & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'  # Weekly run at 04:00 on Monday (§78 D4)
  workflow_dispatch:

jobs:
  test:
    name: Backend & Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.lock ]; then
            pip install --no-deps -r backend/requirements.lock
          else
            pip install -r backend/requirements.txt
          fi
          pip install pytest pytest-asyncio pip-audit pyflakes

      - name: Check Python dependencies for conflicts
        run: |
          pip check

      - name: Run Hermetic Pytest (without .env)
        run: |
          rm -f .env backend/.env
          pytest -q

      - name: Audit Python dependencies
        run: |
          pip-audit -r backend/requirements.lock

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Type check frontend
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Audit frontend dependencies
        run: |
          cd frontend
          npm audit --omit=dev

      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Start Mock Backend for E2E
        run: |
          DATA_BACKEND=mock EXPECTED_WALLET_ADDRESS="11111111111111111111111111111111" RATE_LIMIT_PAID_PER_MINUTE=1000 RATE_LIMIT_GENERAL_PER_MINUTE=2000 uvicorn api.main:app --app-dir backend --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/api/health | grep -q "ok"; then
              echo "Backend is ready on port 8000."
              break
            fi
            echo "Waiting for backend..."
            sleep 1
          done

      - name: Run Frontend E2E Tests
        run: |
          cd frontend
          npm run test:e2e
