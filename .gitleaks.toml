# Gitleaks configuration
# Extends default rules while allowlisting test dummy tokens and fixtures

[extend]
useDefault = true

[allowlist]
description = "Allowlist for test dummy credentials and synthetic payloads"
regexes = [
    '''(?i)test-operator-secret''',
    '''(?i)my-secret-api-key''',
    '''(?i)test-operator-admin-token''',
    '''(?i)DEEPSEEK_API_KEY=""''',
    '''(?i)GROQ_API_KEY=""''',
]
paths = [
    '''\.github/workflows/tests\.yml''',
]
